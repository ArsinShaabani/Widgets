<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Widgets · playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>Widgets playground</h1>
          <p>web · Windows · Android · iOS — one codebase, canvas rendered</p>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Widget">
        <button class="tab is-active" data-widget="metrics" role="tab" aria-selected="true">
          Server monitor
        </button>
        <button class="tab" data-widget="logs" role="tab" aria-selected="false">Log stream</button>
        <button class="tab" data-widget="containers" role="tab" aria-selected="false">Container grid</button>
      </nav>
    </header>

    <section class="controls" id="controls-metrics">
      <label>
        <span>Data source</span>
        <select id="m-source">
          <option value="mock" selected>Mock (in-process)</option>
          <option value="ws">WebSocket :4310</option>
          <option value="sse">Server-Sent Events</option>
          <option value="http">HTTP polling</option>
          <option value="flat">HTTP (flat payload)</option>
        </select>
      </label>

      <label>
        <span>Theme</span>
        <select id="m-theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <label>
        <span>Columns</span>
        <select id="m-columns">
          <option value="auto" selected>Responsive</option>
          <option value="2">Two columns</option>
          <option value="1">Single column</option>
        </select>
      </label>

      <label>
        <span>Locale</span>
        <select id="m-locale">
          <option value="en" selected>English</option>
          <option value="fa">فارسی</option>
        </select>
      </label>

      <label>
        <span>Mock CPU baseline</span>
        <input id="m-stress" type="range" min="10" max="95" value="52" step="1" />
      </label>
    </section>

    <section class="controls" id="controls-logs" hidden>
      <label>
        <span>Data source</span>
        <select id="l-source">
          <option value="mock" selected>Mock (in-process)</option>
          <option value="mockBurst">Mock · incident burst</option>
          <option value="ws">WebSocket :4310/logs/stream</option>
          <option value="sse">Server-Sent Events</option>
          <option value="http">HTTP batches</option>
          <option value="raw">HTTP raw lines (aliases)</option>
        </select>
      </label>

      <label>
        <span>Theme</span>
        <select id="l-theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <label>
        <span>Columns</span>
        <select id="l-columns">
          <option value="auto" selected>Responsive</option>
          <option value="2">Two columns</option>
          <option value="1">Single column</option>
        </select>
      </label>

      <label>
        <span>Locale</span>
        <select id="l-locale">
          <option value="en" selected>English</option>
          <option value="fa">فارسی</option>
        </select>
      </label>

      <label>
        <span>Level filter</span>
        <select id="l-level">
          <option value="" selected>All levels</option>
          <option value="info">info and above</option>
          <option value="warn">warn and above</option>
          <option value="error">errors only</option>
        </select>
      </label>

      <label>
        <span>Follow tail</span>
        <select id="l-follow">
          <option value="true" selected>Following</option>
          <option value="false">Paused</option>
        </select>
      </label>
    </section>


    <section class="controls" id="controls-containers" hidden>
      <label>
        <span>Data source</span>
        <select id="c-source">
          <option value="mock" selected>Mock fleet (in-process)</option>
          <option value="mockIncident">Mock · incident window</option>
          <option value="ws">WebSocket :4310/containers/stream</option>
          <option value="sse">Server-Sent Events</option>
          <option value="http">HTTP snapshots</option>
          <option value="k8s">HTTP Kubernetes shape</option>
        </select>
      </label>

      <label>
        <span>Theme</span>
        <select id="c-theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <label>
        <span>Columns</span>
        <select id="c-columns">
          <option value="auto" selected>Responsive</option>
          <option value="2">Two columns</option>
          <option value="1">Single column</option>
        </select>
      </label>

      <label>
        <span>Locale</span>
        <select id="c-locale">
          <option value="en" selected>English</option>
          <option value="fa">فارسی</option>
        </select>
      </label>

      <label>
        <span>Sort</span>
        <select id="c-sort">
          <option value="severity" selected>Most severe first</option>
          <option value="restarts">Most restarts</option>
          <option value="cpu">Highest CPU</option>
          <option value="memory">Highest memory</option>
          <option value="name">Name</option>
        </select>
      </label>

      <label>
        <span>Focus</span>
        <select id="c-attention">
          <option value="false" selected>Everything</option>
          <option value="true">Needs attention only</option>
        </select>
      </label>
    </section>

    <main>
      <section class="stage" id="stage">
        <server-monitor id="monitor"></server-monitor>
        <log-stream id="logs" hidden></log-stream>
        <container-grid id="fleet" hidden></container-grid>
      </section>

      <aside class="side">
        <h2>Live events</h2>
        <ul id="events" class="events"></ul>

        <h2>Embed it</h2>
        <pre class="code" id="snippet"><code></code></pre>

        <h2>Sections</h2>
        <div class="toggles" id="toggles"></div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
